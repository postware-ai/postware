  allowed: true

- name: end user does not comment on another person
  pack: core
  principal: { kind: end_user, person: { $fixture: person-rafael } }
  action: create
  model: note
  record:
    body: "Hello Ada."
    author: { model: person, $fixture: person-rafael }
    about: [ { model: person, $fixture: person-ada } ]
  allowed: false

- name: end user does not write a note in someone else's name
  pack: core
  principal: { kind: end_user, person: { $fixture: person-rafael } }
  action: create
  model: note
  record:
    body: "Signed, Ada."
    author: { model: person, $fixture: person-ada }
    about: [ { model: person, $fixture: person-rafael } ]
  allowed: false

- name: the public reads no person
  pack: core
  principal: { kind: public }
  action: read
  model: person
  record: { $fixture: person-ada }
  allowed: false

- name: a member reads any person by role
  pack: core
  principal: { kind: member, roles: [member] }
  action: read
  model: person
  record: { $fixture: person-ada }
  allowed: true

- name: end user does not read policies
  pack: core
  principal: { kind: end_user, person: { $fixture: person-ada } }
  action: read
  model: policy
  record: { $fixture: policy-support-role }
  allowed: false

- name: a member reads policies, an admin-only model that members may read
  pack: core
  principal: { kind: member, roles: [member] }
  action: read
  model: policy
  record: { $fixture: policy-support-role }
  allowed: true

