# Policy vectors for the pack defaults (standard/policies/<pack>.yaml). The fixtures of core and system and of
# the named pack are loaded; the default policies of core and of that pack are installed; nothing else.
# `allowed: false` means 403 for writes and, for reads, 404 on get and an empty list on query. `@now` is the
# time of the request, after every fixture's past dates and before 2027. Format: conformance/README.md.

# ---------------------------------------------------------------- core
- name: end user reads own person
  pack: core
  principal: { kind: end_user, person: { $fixture: person-ada } }
  action: read
  model: person
  record: { $fixture: person-ada }
  allowed: true

- name: end user does not read another person
  pack: core
  principal: { kind: end_user, person: { $fixture: person-ada } }
  action: read
  model: person
  record: { $fixture: person-tomasz }
  allowed: false

- name: end user updates own job title and locale
  pack: core
  principal: { kind: end_user, person: { $fixture: person-ada } }
  action: update
  model: person
  record: { $fixture: person-ada }
  patch: { job_title: "Director of Operations", locale: "en-GB" }
  allowed: true

- name: end user does not update own affiliations
  pack: core
  principal: { kind: end_user, person: { $fixture: person-ada } }
  action: update
  model: person
  record: { $fixture: person-ada }
  patch: { affiliations: [] }
  allowed: false

- name: end user does not update another person
  pack: core
  principal: { kind: end_user, person: { $fixture: person-ada } }
  action: update
  model: person
  record: { $fixture: person-tomasz }
  patch: { locale: "en-GB" }
  allowed: false

- name: end user does not delete own person
  pack: core
  principal: { kind: end_user, person: { $fixture: person-ada } }
  action: delete
  model: person
  record: { $fixture: person-ada }
  allowed: false

- name: end user reads its own comment
  pack: core
  principal: { kind: end_user, person: { $fixture: person-rafael } }
  action: read
  model: note
  record: { $fixture: note-rafael-comment }
