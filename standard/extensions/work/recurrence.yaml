# Published extension declarations for Tasks: scheduling, effort and ordering attributes that differ per tool.
# URN urn:postware:ext:work:<name>; stored at ext.work.<name>.

- model: task
  namespace: work
  name: recurrence
  type: Recurrence
  description: "An RFC 5545 RRULE for a task that recurs on completion; natural-language rules are translated or kept in source.payload."
  index: false
