# Published extension declarations for Teams: hierarchy and typing that only some tools have. URN
# urn:postware:ext:org:<name>; stored at ext.org.<name>. parent and lead hold record ids as strings because
# extension declarations carry no reference type.

- model: team
  namespace: org
  name: parent
  type: string
  description: "The id of the parent Team in the hierarchy."
  index: true
