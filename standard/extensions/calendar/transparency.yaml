# Published extension declarations for Events: recurrence exceptions and the per-event settings calendars
# disagree on. URN urn:postware:ext:calendar:<name>; stored at ext.calendar.<name>. The core carries one RRULE per
# series; these declarations carry the rest of RFC 5545.

- model: event
  namespace: calendar
  name: transparency
  type: enum
  description: "RFC 5545 TRANSP: whether the event blocks time (opaque) or not (transparent)."
  enum: [opaque, transparent]
  index: false
