# Published extension declarations of the support pack: ticket attributes that vendors disagree on or that are
# not needed on day one. URN urn:postware:ext:support:<name>; stored at ext.support.<name>.

- model: ticket
  namespace: support
  name: parent
  type: string
  description: "The id of the parent Ticket (a problem this incident belongs to, a tracker, a follow-up source)."
  index: true
